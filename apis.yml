name: Evident.io (Palo Alto Networks)
description: 'Evident.io was a cloud security posture management (CSPM) company whose Evident Security
  Platform (ESP) continuously monitored AWS and other public-cloud accounts for misconfigurations and
  compliance drift via an agentless, API-driven control engine. Palo Alto Networks acquired Evident.io
  in March 2018 and folded the ESP technology into its Prisma Cloud offering; the standalone evident.io
  brand, website, and ESP API have since been retired. Surfaced as a portfolio company of
  bain-capital-ventures and tracked in the API Evangelist network as a security-sector lead.'
